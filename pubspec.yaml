name: minerva_app
description: "Minerva Nail Art - a minimal nail salon appointment booking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Turkish + English UI strings, dates and number symbols.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management for the booking draft + saved appointments.
  provider: ^6.1.2

  # Local persistence of appointments (key/value JSON store).
  shared_preferences: ^2.3.3

  # Poppins typography, as specified by the design.
  google_fonts: ^6.2.1

  # Locale-aware date/time formatting ("Friday, 14 August 2026").
  intl: ^0.20.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
