name: minerva_app
description: "Minerva Nail Art - a minimal nail salon appointment booking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Turkish + English UI strings, dates and number symbols.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management for the booking draft + saved appointments.
  provider: ^6.1.2

  # Local persistence of appointments (key/value JSON store).
  shared_preferences: ^2.3.3

  # Locale-aware date/time formatting ("Friday, 14 August 2026").
  intl: ^0.20.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # Poppins bundled as an asset, so the app never fetches it from Google at
  # runtime (audit finding H-2). Weights match what the UI uses: 400 Regular,
  # 500 Medium, 600 SemiBold, plus 700 Bold for the Material text styles that
  # default to it. Licensed OFL — see assets/fonts/Poppins-OFL.txt.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
